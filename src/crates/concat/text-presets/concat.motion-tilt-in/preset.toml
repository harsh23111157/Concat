# Playful tilt-and-pop entrance.
id = "concat.motion-tilt-in"
name = "Tilt in"
language = "Latin"
order = 45
offsetY = 0.0

[style]
content = "Tilt in"
fontFamily = "Montserrat"
fontWeight = 800
fontSize = 0.09
shadow = false

# Rotates level while scaling up and sliding in.
[[animation]]
property = "rotation"
atSeconds = 0.0
value = -8.0

[[animation]]
property = "rotation"
atSeconds = 0.4
value = 0.0
ease = [0.34, 1.56, 0.64, 1.0]

[[animation]]
property = "scale"
atSeconds = 0.0
value = 0.6

[[animation]]
property = "scale"
atSeconds = 0.4
value = 1.0
ease = [0.34, 1.56, 0.64, 1.0]

[[animation]]
property = "opacity"
atSeconds = 0.0
value = 0.0

[[animation]]
property = "opacity"
atSeconds = 0.15
value = 1.0
ease = [0.215, 0.61, 0.355, 1.0]
